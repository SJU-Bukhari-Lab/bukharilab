<article class="feature" {% if include.flip %}data-flip{% endif %}>
  {% if include.image %}
    <a
      class="feature__media"
      {% if include.link %}href="{{ include.link | relative_url | uri_escape }}"{% endif %}
      {% unless include.link %}aria-hidden="true" tabindex="-1"{% endunless %}
    >
      <img
        src="{{ include.image | relative_url | uri_escape }}"
        alt=""
        loading="lazy"
        decoding="async"
        {% include fallback.html %}
      >
    </a>
  {% endif %}
  <div class="feature__body">
    {% if include.title %}<h3 class="feature__title">{{ include.title }}</h3>{% endif %}
    <div class="feature__text">{{ include.text | markdownify }}</div>
  </div>
</article>
