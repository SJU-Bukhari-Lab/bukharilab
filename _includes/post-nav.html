<nav class="post-nav" aria-label="Post navigation">
  {% if include.post.previous %}
    <a href="{{ include.post.previous.url | relative_url }}">
      <span>{% include icon.html icon="fa-solid fa-angle-left" %} Previous post</span>
      <strong>{{ include.post.previous.title }}</strong>
    </a>
  {% else %}<span></span>{% endif %}
  {% if include.post.next %}
    <a href="{{ include.post.next.url | relative_url }}">
      <span>Next post {% include icon.html icon="fa-solid fa-angle-right" %}</span>
      <strong>{{ include.post.next.title }}</strong>
    </a>
  {% endif %}
</nav>
