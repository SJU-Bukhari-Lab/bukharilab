<!-- Third-party libraries are pinned to exact versions for reproducible builds. -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" defer crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.umd.min.js" defer crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mark.js@8.11.1/dist/mark.min.js" defer crossorigin="anonymous"></script>

<!-- Include all local JavaScript files. -->
{% assign scripts = site.static_files | where_exp: "file", "file.path contains '/_scripts'" | sort: "path" %}
{% for script in scripts %}
  <script src="{{ script.path | relative_url }}" defer></script>
{% endfor %}
