title: Bukhari Lab
subtitle: Biomedical Data Science & Healthcare AI
description: Advancing Biomedical Data Science through Transparent, Explainable, and Trustworthy AI.
header: images/brand/nyc-banner.jpg
footer: images/brand/nyc-banner.jpg
proofer: false
url: https://bukharilab.org
baseurl: ''
hugging_face_url: https://huggingface.co/BukhariLab
links:
  google-scholar: JhWJ5PEAAAAJ
  github: bukharilab
  website: https://bukharilab.org
  linkedin: https://www.linkedin.com/company/bukharilab
defaults:
- scope:
    path: ''
  values:
    layout: default
- scope:
    type: members
  values:
    layout: member
- scope:
    type: projects
  values:
    layout: project
- scope:
    type: posts
  values:
    layout: post
collections:
  members:
    output: true
  projects:
    output: true
  posts:
    output: true
plugins:
- jekyll-spaceship
- jekyll-sitemap
- jekyll-redirect-from
- jekyll-feed
- jekyll-last-modified-at
highlighter: rouge
theme: null
sass:
  sass_dir: _styles
include:
- _styles
- _scripts
exclude:
- '*-backup-*'
- '**/*-backup-*'
- README.md
- LICENSE.md
- _site
- vendor
- .jekyll-cache
- .bundle
- .sass-cache
jekyll-spaceship:
  mathjax-processor:
    src:
    - https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js
