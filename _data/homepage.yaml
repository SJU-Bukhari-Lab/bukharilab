active_projects:
  - title: "Neuro-Symbolic AI for Drug Repurposing"
    label: "Drug Repurposing AI"
    description: "This NIH-funded project develops hybrid neuro-symbolic AI methods to identify and evaluate potential therapeutic uses of existing drugs. It combines biomedical knowledge, clinical evidence, and machine learning to support more explainable and reliable drug-repurposing discoveries."
    icon: "fa-solid fa-capsules"
    link: "research"
    external: false

  - title: "Narrative-Driven AI for Clinician Burnout Surveillance"
    label: "Clinician Well-Being"
    description: "This project investigates how clinical narratives and healthcare data can reveal early signals associated with clinician burnout. The goal is to develop responsible and interpretable AI methods that support organizational awareness and timely intervention."
    icon: "fa-solid fa-user-doctor"
    link: "research"
    external: false

  - title: "Trustworthy Algorithms for Extreme Multi-Label Medical Coding"
    label: "Medical Coding"
    description: "This project develops trustworthy and hierarchy-aware algorithms for assigning medical codes from large and complex coding systems. The work focuses on extreme multi-label classification, explainability, structural validity, and improved performance for rare clinical codes."
    icon: "fa-solid fa-code"
    link: "research"
    external: false

  - title: "A Socio-Technical Approach to Biomedical Content Authoring and Publishing"
    label: "Biomedical Publishing"
    description: "This project explores how researchers, domain experts, semantic technologies, and intelligent systems can work together to improve biomedical content authoring and publishing. The goal is to make scientific content more structured, interoperable, reusable, and accessible to both humans and machines."
    icon: "fa-solid fa-book-open-reader"
    link: "research"
    external: false

