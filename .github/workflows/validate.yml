name: Validate website

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _cite/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r _cite/requirements.txt \
            Pillow==11.3.0

      - name: Validate Python scripts
        run: |
          python -m py_compile \
            scripts/audit_faculty_feedback.py \
            scripts/public_release_audit.py \
            scripts/refresh_project_images.py \
            scripts/optimize_built_site.py

      - name: Validate JavaScript syntax
        run: |
          find _scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify project image mappings
        run: python scripts/refresh_project_images.py . --check

      - name: Build site
        run: bundle exec jekyll build

      - name: Run source audits
        run: |
          python scripts/public_release_audit.py .
          python scripts/audit_faculty_feedback.py .

      - name: Check generated HTML
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href

      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check
          fi
