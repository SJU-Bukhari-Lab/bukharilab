name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _cite/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r _cite/requirements.txt \
            Pillow==11.3.0

      # Publication data is committed to the repository so deployments are
      # reproducible. Refresh it separately with scripts/refresh_publications.sh.
      - name: Build site
        run: bundle exec jekyll build

      - name: Run source audits
        run: |
          python scripts/public_release_audit.py .
          python scripts/audit_faculty_feedback.py .
          python scripts/refresh_project_images.py . --check

      - name: Check generated HTML
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href

      - name: Optimize generated site
        run: python scripts/optimize_built_site.py --site-dir _site

      - name: Audit generated public site
        run: python scripts/public_release_audit.py . --include-built

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
