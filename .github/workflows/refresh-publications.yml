name: Refresh publication data

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publication-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _cite/requirements.txt

      - name: Install publication dependencies
        run: python -m pip install --disable-pip-version-check -r _cite/requirements.txt

      - name: Refresh publication records
        run: python _cite/cite.py

      - name: Open a reviewable pull request when data changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/citations.yaml; then
            echo "Publication data is already current."
            exit 0
          fi

          branch="automation/publication-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add _data/citations.yaml
          git commit -m "Refresh publication data"
          git push --set-upstream origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Refresh publication data" \
            --body "Automated publication-data refresh. Review the generated citation changes before merging."
